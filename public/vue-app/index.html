<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 旅行规划师 · Vue 3</title>
  <link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* 里程碑1/2 微调 */
    #app { min-height: 100vh; }
    .vue-top { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: 10px 18px; display: flex; align-items: center;
      justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .vue-body { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; max-width: 1100px; margin: 0 auto; }
    @media (max-width: 860px) { .vue-body { grid-template-columns: 1fr; } }
    .vue-nav { display: flex; gap: 4px; }
    .vue-nav button { border: 1px solid transparent; background: transparent; padding: 7px 12px; border-radius: 10px;
      cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); transition: all .15s ease; }
    .vue-nav button:hover { color: #4338ca; background: #eef2ff; }
    .vue-nav button.active { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff;
      box-shadow: 0 4px 12px rgba(79,70,229,.28); }
    .vue-page { max-width: 980px; margin: 16px auto; padding: 0 16px 28px; }
    .vue-head-row { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 12px; flex-wrap: wrap; }
    .vue-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 760px) { .vue-grid2 { grid-template-columns: 1fr; } }
    .kb-tabbar { display: flex; gap: 6px; margin-bottom: 10px; }
    .kb-tabbar button { flex: 1; border: 1px solid var(--border); background: #fff; border-radius: 10px;
      padding: 7px 4px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
    .kb-tabbar button.active { background: #eef2ff; border-color: #a5b4fc; color: #4338ca; }
    .hist-item { display: flex; align-items: center; gap: 8px; background: #f8fafc; border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
    .hist-item:hover { border-color: #a5b4fc; }
    .hist-item.active { border-color: #4f46e5; background: #eef2ff; }
    .hist-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .msg-acts { display: flex; gap: 6px; margin-top: 5px; }
    .msg-acts .mini { font-size: 11px; padding: 2px 8px; }
    .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .fav-card { display: flex; flex-direction: column; gap: 8px; }
    .fav-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .fav-body { font-size: 13px; color: #334155; max-height: 220px; overflow: auto; white-space: pre-wrap;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
    .fav-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .stat-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
    .stat-chip { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 999px;
      padding: 6px 14px; font-size: 13px; font-weight: 600; }
    .v-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px;
      box-shadow: var(--shadow); }
    .mem-item { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: #fffbeb;
      border: 1px solid #fde68a; border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; font-size: 13px; }
    .empty-tip { color: var(--muted); text-align: center; padding: 26px; }
    .avatar-pick { display: flex; flex-wrap: wrap; gap: 6px; }
    .avatar-pick .avatar-opt { width: 40px; height: 40px; font-size: 20px; line-height: 1; }
    .avatar-pick .avatar-clear { width: auto; padding: 0 10px; font-size: 13px; }
    .vue-msg { display: flex; gap: 10px; max-width: 92%; }
    .vue-msg.user { flex-direction: row-reverse; align-self: flex-end; }
    .vue-msg .who { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #e0e7ff; }
    .vue-msg.user .who { background: linear-gradient(135deg,#4f46e5,#7c3aed); }
    .vue-bubble { padding: 10px 14px; border-radius: 14px; }
    .vue-msg.user .vue-bubble { background: linear-gradient(135deg,#4f46e5,#7c3aed); color: #fff; }
    .vue-msg.assistant .vue-bubble { background: #fff; border: 1px solid var(--border); }
    .chat-scroll { height: calc(100vh - 250px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px; }
    .toolchip { align-self: flex-start; background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; border-radius:999px;
      padding: 3px 10px; font-size: 12px; font-weight: 600; }
    .pref-item-v { background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:6px 8px;
      font-size:13px; display:flex; justify-content:space-between; gap:6px; margin-bottom:6px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/vendor/vue/vue.global.prod.js"></script>
  <script src="/vue-app/app.js"></script>
</body>
</html>
